# Fragment for config example - full replace of configs/cpa-config.example.yaml
plugins:
  enabled: true
  configs:
    cpa-apply-patch:
      enabled: true
      # 后端服务勾选（管理面板布尔开关）
      backend_claude: true   # Claude 上游
      backend_xai: true      # xAI / Grok（grok* 模型）
      # 模型名过滤，可与后端勾选叠加；* = 不额外限制
      models:
        - "*"
      tools:
        - apply_patch
